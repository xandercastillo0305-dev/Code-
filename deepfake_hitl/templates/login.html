{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-1">Sign in</h1>
    <p class="text-muted small">Authorized investigators and forensic analysts only. All activity is logged.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="user_id">User ID</label>
        <input class="form-control" id="user_id" name="user_id" placeholder="e.g. INV-01" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" name="password" required></div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
